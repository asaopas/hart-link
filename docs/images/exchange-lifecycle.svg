<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540" role="img" aria-labelledby="title description">
  <title id="title">Lifecycle of one HartLink exchange</title>
  <desc id="description">The end-to-end deadline covers admission, queue waiting, physical exchange, bounded retries, and typed decoding.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090f1d"/><stop offset="1" stop-color="#17213a"/></linearGradient><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#7dd3fc"/></marker><marker id="g" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#34d399"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/></filter></defs>
  <rect width="1300" height="540" rx="24" fill="url(#bg)"/><text x="48" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700">One execute call has one end-to-end deadline</text><text x="48" y="79" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">Queue waiting is part of the deadline; retries cannot silently extend it.</text>
  <g font-family="Inter, Segoe UI, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(45 130)"><circle cx="78" cy="45" r="45" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="78" y="40" fill="#dbeafe" font-size="17" font-weight="700">1</text><text x="78" y="63" fill="#93c5fd" font-size="13">execute</text></g>
    <g transform="translate(255 130)"><circle cx="78" cy="45" r="45" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="78" y="40" fill="#ede9fe" font-size="17" font-weight="700">2</text><text x="78" y="63" fill="#c4b5fd" font-size="13">admit</text></g>
    <g transform="translate(465 130)"><circle cx="78" cy="45" r="45" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><text x="78" y="40" fill="#f3e8ff" font-size="17" font-weight="700">3</text><text x="78" y="63" fill="#d8b4fe" font-size="13">enqueue</text></g>
    <g transform="translate(675 130)"><circle cx="78" cy="45" r="45" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="78" y="40" fill="#d1fae5" font-size="17" font-weight="700">4</text><text x="78" y="63" fill="#6ee7b7" font-size="13">transmit</text></g>
    <g transform="translate(885 130)"><circle cx="78" cy="45" r="45" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="78" y="40" fill="#cffafe" font-size="17" font-weight="700">5</text><text x="78" y="63" fill="#67e8f9" font-size="13">receive</text></g>
    <g transform="translate(1095 130)"><circle cx="78" cy="45" r="45" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="78" y="40" fill="#fef3c7" font-size="17" font-weight="700">6</text><text x="78" y="63" fill="#fde68a" font-size="13">decode</text></g>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"><path d="M168 175 H288"/><path d="M378 175 H498"/><path d="M588 175 H708"/><path d="M798 175 H918"/><path d="M1008 175 H1128"/></g>
  <g font-family="Inter, Segoe UI, sans-serif"><rect x="55" y="270" width="1190" height="70" rx="15" fill="#0f2f2a" stroke="#34d399" stroke-width="2"/><text x="80" y="300" fill="#a7f3d0" font-size="16" font-weight="700">TOTAL DEADLINE</text><text x="80" y="324" fill="#6ee7b7" font-size="14">queue capacity wait + queued time + writes + reads + Busy retries + delayed-response polling + late-response guard</text><path d="M250 300 H1190" stroke="#34d399" stroke-width="4" marker-end="url(#g)"/>
    <rect x="55" y="380" width="365" height="105" rx="15" fill="#172554"/><text x="78" y="412" fill="#dbeafe" font-size="16" font-weight="700">No response</text><text x="78" y="439" fill="#93c5fd" font-size="14">bounded transport retry</text><text x="78" y="463" fill="#93c5fd" font-size="14">only when operation safety permits</text>
    <rect x="468" y="380" width="365" height="105" rx="15" fill="#312e81"/><text x="491" y="412" fill="#ede9fe" font-size="16" font-weight="700">Device Busy</text><text x="491" y="439" fill="#c4b5fd" font-size="14">independent Busy retry budget</text><text x="491" y="463" fill="#c4b5fd" font-size="14">does not rewrite operation safety</text>
    <rect x="880" y="380" width="365" height="105" rx="15" fill="#4c1d95"/><text x="903" y="412" fill="#f3e8ff" font-size="16" font-weight="700">Delayed response</text><text x="903" y="439" fill="#d8b4fe" font-size="14">independent bounded polling</text><text x="903" y="463" fill="#d8b4fe" font-size="14">original caller deadline still wins</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">HartLink prioritized queue flow</title>
  <desc id="description">Routing selects an effective queue, policy rejects or admits the command, and a weighted fair scheduler feeds the sole runner.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#17213a"/></linearGradient><marker id="b" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#7dd3fc"/></marker><marker id="r" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#fb7185"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/></filter></defs>
  <rect width="1280" height="500" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700">Prioritized mode: routing first, admission second</text>
  <text x="48" y="80" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">A rejected request consumes neither a request ID nor queue capacity.</text>
  <g font-family="Inter, Segoe UI, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(45 195)"><rect width="165" height="92" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="82" y="40" fill="#dbeafe" font-size="17" font-weight="700">Caller</text><text x="82" y="65" fill="#93c5fd" font-size="14">request</text></g>
    <g transform="translate(260 195)"><rect width="175" height="92" rx="16" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="87" y="40" fill="#ede9fe" font-size="17" font-weight="700">CommandRouting</text><text x="87" y="65" fill="#c4b5fd" font-size="14">effective priority</text></g>
    <g transform="translate(490 195)"><path d="M90 0 L180 46 L90 92 L0 46 Z" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><text x="90" y="42" fill="#f3e8ff" font-size="16" font-weight="700">CommandPolicy</text><text x="90" y="63" fill="#d8b4fe" font-size="13">allow?</text></g>
    <g transform="translate(735 115)"><rect width="190" height="82" rx="15" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="95" y="36" fill="#d1fae5" font-size="17" font-weight="700">Service queue</text><text x="95" y="59" fill="#6ee7b7" font-size="13">bounded FIFO</text></g>
    <g transform="translate(735 285)"><rect width="190" height="82" rx="15" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="95" y="36" fill="#cffafe" font-size="17" font-weight="700">Normal queue</text><text x="95" y="59" fill="#67e8f9" font-size="13">bounded FIFO</text></g>
    <g transform="translate(980 195)"><rect width="170" height="92" rx="16" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="85" y="39" fill="#fef3c7" font-size="17" font-weight="700">Fair scheduler</text><text x="85" y="64" fill="#fde68a" font-size="14">1:1 · 3:1 · N:1</text></g>
    <g transform="translate(1175 195)"><rect width="80" height="92" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="40" y="40" fill="#d1fae5" font-size="15" font-weight="700">Runner</text><text x="40" y="64" fill="#6ee7b7" font-size="12">one owner</text></g>
    <g transform="translate(475 385)"><rect width="210" height="70" rx="14" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="105" y="31" fill="#ffe4e6" font-size="16" font-weight="700">Structured denial</text><text x="105" y="52" fill="#fda4af" font-size="13">no capacity consumed</text></g>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#b)"><path d="M210 241 H260"/><path d="M435 241 H490"/><path d="M670 230 C700 230 700 156 735 156"/><path d="M670 252 C700 252 700 326 735 326"/><path d="M925 156 C955 156 950 220 980 230"/><path d="M925 326 C955 326 950 262 980 252"/><path d="M1150 241 H1175"/></g>
  <path d="M580 287 V385" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#r)"/>
  <text x="690" y="208" fill="#a7f3d0" font-family="Inter, Segoe UI, sans-serif" font-size="13">allow</text><text x="595" y="360" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="13">reject</text>
</svg>

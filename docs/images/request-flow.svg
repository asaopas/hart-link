<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title description">
  <title id="title">HartLink request flow</title>
  <desc id="description">Application tasks use cloneable clients. Requests pass routing, admission, and a bounded queue before the sole runner writes to a HART transport and receives replies.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#7dd3fc"/></marker>
    <marker id="return-arrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1400" height="360" rx="24" fill="url(#background)"/>
  <text x="52" y="52" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="700">One physical line, many independent callers</text>
  <text x="52" y="80" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">Only LinkRunner owns the byte stream, so HART frames cannot interleave.</text>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif" text-anchor="middle">
    <g transform="translate(40 120)"><rect width="165" height="92" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="82.5" y="39" fill="#dbeafe" font-size="17" font-weight="700">Application</text><text x="82.5" y="64" fill="#93c5fd" font-size="14">tasks</text></g>
    <g transform="translate(235 120)"><rect width="165" height="92" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="82.5" y="39" fill="#dbeafe" font-size="17" font-weight="700">Cloneable</text><text x="82.5" y="64" fill="#93c5fd" font-size="14">LinkClient</text></g>
    <g transform="translate(430 120)"><rect width="165" height="92" rx="16" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="82.5" y="39" fill="#ede9fe" font-size="17" font-weight="700">Routing</text><text x="82.5" y="64" fill="#c4b5fd" font-size="14">and admission</text></g>
    <g transform="translate(625 120)"><rect width="165" height="92" rx="16" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><text x="82.5" y="39" fill="#f3e8ff" font-size="17" font-weight="700">Bounded</text><text x="82.5" y="64" fill="#d8b4fe" font-size="14">queue</text></g>
    <g transform="translate(820 120)"><rect width="165" height="92" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="82.5" y="39" fill="#d1fae5" font-size="17" font-weight="700">LinkRunner</text><text x="82.5" y="64" fill="#6ee7b7" font-size="14">sole owner</text></g>
    <g transform="translate(1015 120)"><rect width="165" height="92" rx="16" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="82.5" y="39" fill="#cffafe" font-size="17" font-weight="700">Transport</text><text x="82.5" y="64" fill="#67e8f9" font-size="14">serial / TCP</text></g>
    <g transform="translate(1210 120)"><rect width="150" height="92" rx="16" fill="#713f12" stroke="#fbbf24" stroke-width="2"/><text x="75" y="39" fill="#fef3c7" font-size="17" font-weight="700">HART line</text><text x="75" y="64" fill="#fde68a" font-size="14">device(s)</text></g>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"><path d="M205 166 H235"/><path d="M400 166 H430"/><path d="M595 166 H625"/><path d="M790 166 H820"/><path d="M985 166 H1015"/><path d="M1180 166 H1210"/></g>
  <path d="M1285 212 C1285 315 905 315 905 212" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#return-arrow)"/>
  <text x="1095" y="302" fill="#a7f3d0" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle">ACK · BACK · Burst · errors</text>
</svg>

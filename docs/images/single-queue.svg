<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title description">
  <title id="title">HartLink single queue mode</title>
  <desc id="description">All allowed commands enter one bounded FIFO and caller priorities are ignored.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#17213a"/></linearGradient><marker id="b" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#7dd3fc"/></marker><marker id="r" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#fb7185"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/></filter></defs>
  <rect width="1120" height="330" rx="24" fill="url(#bg)"/><text x="48" y="52" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700">Single queue mode: strict global FIFO</text><text x="48" y="80" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">Use this when the application does not need latency classes or priority scheduling.</text>
  <g font-family="Inter, Segoe UI, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(55 145)"><rect width="180" height="88" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="90" y="38" fill="#dbeafe" font-size="17" font-weight="700">All callers</text><text x="90" y="62" fill="#93c5fd" font-size="14">priority ignored</text></g>
    <g transform="translate(310 143)"><path d="M90 0 L180 46 L90 92 L0 46 Z" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="90" y="42" fill="#ede9fe" font-size="16" font-weight="700">CommandPolicy</text><text x="90" y="63" fill="#c4b5fd" font-size="13">allow?</text></g>
    <g transform="translate(575 145)"><rect width="230" height="88" rx="16" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/><text x="115" y="37" fill="#f3e8ff" font-size="17" font-weight="700">One bounded FIFO</text><text x="115" y="62" fill="#d8b4fe" font-size="14">global insertion order</text></g>
    <g transform="translate(880 145)"><rect width="180" height="88" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="90" y="38" fill="#d1fae5" font-size="17" font-weight="700">LinkRunner</text><text x="90" y="62" fill="#6ee7b7" font-size="14">sole channel owner</text></g>
    <g transform="translate(330 260)"><rect width="140" height="48" rx="12" fill="#4c0519" stroke="#fb7185" stroke-width="2"/><text x="70" y="30" fill="#ffe4e6" font-size="14" font-weight="700">rejected</text></g>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#b)"><path d="M235 189 H310"/><path d="M490 189 H575"/><path d="M805 189 H880"/></g><path d="M400 235 V260" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#r)"/>
</svg>

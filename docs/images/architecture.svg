<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">HartLink module architecture</title>
  <desc id="description">The portable core is independent from the optional asynchronous runtime and extension modules.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#13213d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.5"/></filter><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L0 10 L12 5 z" fill="#7dd3fc"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="48" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700">Modules stay independent until the application composes them</text>
  <text x="48" y="78" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">The wire and operation layers work with no standard library or asynchronous runtime.</text>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="40" y="108" width="1120" height="210" rx="22" fill="#0f2742" stroke="#38bdf8" stroke-width="2"/><text x="64" y="140" fill="#7dd3fc" font-size="18" font-weight="700">PORTABLE CORE · no_std + alloc</text>
    <g filter="url(#s)" text-anchor="middle">
      <g transform="translate(75 170)"><rect width="225" height="105" rx="15" fill="#172554"/><text x="112" y="45" fill="#dbeafe" font-size="18" font-weight="700">wire</text><text x="112" y="70" fill="#93c5fd" font-size="14">frames · decoder · checksum</text></g>
      <g transform="translate(340 170)"><rect width="225" height="105" rx="15" fill="#312e81"/><text x="112" y="45" fill="#ede9fe" font-size="18" font-weight="700">operation</text><text x="112" y="70" fill="#c4b5fd" font-size="14">typed and raw commands</text></g>
      <g transform="translate(605 170)"><rect width="225" height="105" rx="15" fill="#4c1d95"/><text x="112" y="45" fill="#f3e8ff" font-size="18" font-weight="700">inspect</text><text x="112" y="70" fill="#d8b4fe" font-size="14">validation · diagnostics</text></g>
      <g transform="translate(870 170)"><rect width="225" height="105" rx="15" fill="#134e4a"/><text x="112" y="45" fill="#ccfbf1" font-size="18" font-weight="700">catalog + tables</text><text x="112" y="70" fill="#5eead4" font-size="14">class · safety · unknowns</text></g>
    </g>
    <rect x="40" y="350" width="690" height="315" rx="22" fill="#102d2b" stroke="#34d399" stroke-width="2"/><text x="64" y="382" fill="#6ee7b7" font-size="18" font-weight="700">OPTIONAL ASYNC RUNTIME</text>
    <g filter="url(#s)" text-anchor="middle">
      <g transform="translate(75 415)"><rect width="620" height="88" rx="15" fill="#064e3b"/><text x="310" y="38" fill="#d1fae5" font-size="18" font-weight="700">service</text><text x="310" y="63" fill="#6ee7b7" font-size="14">queue · runner · session · discovery · Burst · transfer</text></g>
      <g transform="translate(75 535)"><rect width="285" height="88" rx="15" fill="#164e63"/><text x="142" y="38" fill="#cffafe" font-size="18" font-weight="700">channel</text><text x="142" y="63" fill="#67e8f9" font-size="14">serial · transparent TCP</text></g>
      <g transform="translate(410 535)"><rect width="285" height="88" rx="15" fill="#713f12"/><text x="142" y="38" fill="#fef3c7" font-size="18" font-weight="700">profile</text><text x="142" y="63" fill="#fde68a" font-size="14">topology · shifts · timing</text></g>
    </g>
    <rect x="760" y="350" width="400" height="315" rx="22" fill="#251946" stroke="#a78bfa" stroke-width="2"/><text x="784" y="382" fill="#c4b5fd" font-size="18" font-weight="700">OPTIONAL EXTENSIONS</text>
    <g filter="url(#s)" text-anchor="middle" font-size="16" font-weight="700">
      <g transform="translate(795 415)"><rect width="150" height="78" rx="14" fill="#312e81"/><text x="75" y="35" fill="#ede9fe">DeviceInfo</text><text x="75" y="57" fill="#c4b5fd" font-size="13" font-weight="400">FDI packages</text></g>
      <g transform="translate(975 415)"><rect width="150" height="78" rx="14" fill="#312e81"/><text x="75" y="35" fill="#ede9fe">HART-IP</text><text x="75" y="57" fill="#c4b5fd" font-size="13" font-weight="400">Version 1 session</text></g>
      <g transform="translate(795 535)"><rect width="150" height="78" rx="14" fill="#4c1d95"/><text x="75" y="35" fill="#f3e8ff">WirelessHART</text><text x="75" y="57" fill="#d8b4fe" font-size="12" font-weight="400">software tests only</text></g>
      <g transform="translate(975 535)"><rect width="150" height="78" rx="14" fill="#4c1d95"/><text x="75" y="35" fill="#f3e8ff">lab tools</text><text x="75" y="57" fill="#d8b4fe" font-size="13" font-weight="400">emulate · trace · verify</text></g>
    </g>
  </g>
  <path d="M385 350 V325 H452 V275" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/><path d="M760 505 H730" fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/>
</svg>
